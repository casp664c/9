name: Kaninbanker Source Audit

on:
  push:
    branches:
      - build/kaninbanker-unity-live
  pull_request:
    branches:
      - build/kaninbanker-unity-live
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run TRUE 2D source audit
        run: python scripts/source_audit.py

      - name: Run Unity 2D asset pipeline audit
        run: python scripts/asset_pipeline_audit.py
